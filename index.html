<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#141210">
  <title>Le P'tit Booth - by Giloop</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app" data-state="camera">

    <header class="topbar">
      <h1 class="brand">Le P'tit <em>Booth</em></h1>
      <div class="topbar-actions">
        <button class="chip" id="printer-chip" type="button" data-connected="false">
          <span class="dot"></span>
          <span id="printer-label">Imprimante</span>
        </button>
        <button class="icon-btn" id="settings-btn" type="button" aria-label="Réglages">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm8.6-2.6.1-.9-.1-.9 2-1.6-2-3.4-2.4.9a8 8 0 0 0-1.6-.9L16.2 3h-4l-.4 2.5c-.6.2-1.1.5-1.6.9l-2.4-.9-2 3.4 2 1.6-.1.9.1.9-2 1.6 2 3.4 2.4-.9c.5.4 1 .7 1.6.9l.4 2.5h4l.4-2.5c.6-.2 1.1-.5 1.6-.9l2.4.9 2-3.4-2-1.6Z"/></svg>
        </button>
      </div>
    </header>

    <main class="stage">
      <!-- Camera -->
      <section class="view view-camera">
        <div class="viewfinder" id="viewfinder">
          <video id="video" playsinline muted autoplay></video>
          <div class="frame-corners" aria-hidden="true"></div>
          <div class="countdown" id="countdown" aria-live="assertive"></div>
          <div class="flash" id="flash"></div>
          <div class="camera-message" id="camera-message" hidden>
            <p id="camera-message-text"></p>
            <button class="btn btn-ghost" id="camera-retry" type="button">Réessayer</button>
          </div>
        </div>
      </section>

      <!-- Processing / preview / printing -->
      <section class="view view-result">
        <div class="ticket-wrap">
          <div class="ticket" id="ticket">
            <canvas id="ticket-canvas" width="384" height="600"></canvas>
          </div>
          <div class="busy" id="busy">
            <div class="spinner"></div>
            <p id="busy-text">Détourage en cours…</p>
            <div class="progress" id="print-progress" hidden><span></span></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="controls">
      <!-- Camera controls -->
      <div class="controls-row controls-camera">
        <span class="side-slot"></span>
        <button class="shutter" id="shutter" type="button" aria-label="Prendre la photo" disabled>
          <span class="shutter-inner"></span>
        </button>
        <button class="icon-btn side-slot" id="flip-btn" type="button" aria-label="Changer de caméra">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6h-3.2l-1.8-2H9L7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2Zm-8 12a5 5 0 0 1-4.9-4H5l3-3 3 3H9.1a3 3 0 0 0 5.2 1.5l1.4 1.4A5 5 0 0 1 12 18Zm4-5-3-3h1.9a3 3 0 0 0-5.2-1.5L8.3 7.1A5 5 0 0 1 16.9 10H19l-3 3Z"/></svg>
        </button>
      </div>
      <!-- Preview controls -->
      <div class="controls-row controls-preview">
        <button class="btn btn-ghost" id="retake-btn" type="button">Reprendre</button>
        <button class="btn btn-primary" id="print-btn" type="button">Imprimer</button>
      </div>
      <p class="status-line" id="status-line"></p>
    </footer>

    <!-- Model loading overlay -->
    <div class="loader" id="loader">
      <div class="loader-card">
        <p class="brand brand-lg">Le P'tit <em>Booth</em></p>
        <p id="loader-text">Chargement du modèle de détourage…</p>
        <div class="progress"><span id="loader-bar"></span></div>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <dialog class="sheet" id="settings">
    <form method="dialog" id="settings-form">
      <header class="sheet-head">
        <h2>Réglages</h2>
        <button class="icon-btn" value="close" aria-label="Fermer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7l-1.4-1.4L9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3 1.4 1.4Z" transform="translate(1.5 0)"/></svg>
        </button>
      </header>

      <fieldset>
        <legend>Bannière</legend>
        <label>Titre
          <input name="title" type="text" maxlength="40" placeholder="Le mariage de Léa &amp; Tom">
        </label>
        <label>Sous-titre
          <input name="subtitle" type="text" maxlength="60" placeholder="Merci d'être venus !">
        </label>
        <label class="switch">
          <input name="showDate" type="checkbox">
          <span>Afficher la date</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>Photo</legend>
        <label class="switch">
          <input name="removeBackground" type="checkbox">
          <span>Détourer (supprimer l'arrière-plan)</span>
        </label>
        <label>Compte à rebours
          <select name="countdown">
            <option value="0">Aucun</option>
            <option value="3">3 secondes</option>
            <option value="5">5 secondes</option>
            <option value="10">10 secondes</option>
          </select>
        </label>
        <label>Luminosité <output name="brightnessOut"></output>
          <input name="brightness" type="range" min="-60" max="60" step="5">
        </label>
        <label>Contraste <output name="contrastOut"></output>
          <input name="contrast" type="range" min="-50" max="80" step="5">
        </label>
        <label>Tramage
          <select name="dither">
            <option value="atkinson">Atkinson (net)</option>
            <option value="floyd">Floyd-Steinberg (doux)</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Imprimante</legend>
        <label>Densité d'impression
          <select name="density">
            <option value="0">Claire</option>
            <option value="1">Moyenne</option>
            <option value="2">Foncée</option>
          </select>
        </label>
        <button class="btn btn-ghost btn-block" id="disconnect-btn" type="button">Déconnecter l'imprimante</button>
      </fieldset>

      <p class="sheet-note">Chrome sur Android · imprimante Lidl 5890 · fonctionne hors ligne après le premier chargement.</p>
    </form>
  </dialog>

  <!-- Reprint question, after a ticket has printed -->
  <dialog class="sheet confirm" id="reprint">
    <form method="dialog">
      <p class="confirm-text">Voulez-vous imprimer un autre ticket ?</p>
      <div class="confirm-actions">
        <button class="btn btn-ghost" value="no">Non</button>
        <button class="btn btn-primary" value="yes" autofocus>Oui</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
